name: Reset Prod DB (DESTRUCTIVE)

# Manual one-shot wipe of every user-owned table in production.
#
# Why a workflow instead of a Bash script the user runs locally?
#   - The PROD_SSH_KEY + PROD_HOST + PROD_USER are already in repo secrets
#     for the deploy pipeline, so the user does not have to keep their
#     own copy of the key locally.
#   - Workflow runs are auditable — the entire reset shows up in the
#     Actions tab with logs and a timestamp.
#   - Confirmation gate: the workflow refuses to run unless the user
#     types the literal phrase RESET PROD into the dispatch input.
#
# The actual TRUNCATE happens inside the akis-prod-db container via the
# checked-in scripts/prod-db-reset.sh. This workflow just SSHes in and
# pipes the script through psql with a non-interactive confirmation.
#
# After running:
#   - All users gone. Every account must re-sign up.
#   - All workflows / pipelines / messages / OAuth links / API keys gone.
#   - Schema + drizzle migration ledger preserved.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET PROD to confirm the truncate.'
        required: true
        default: ''

jobs:
  reset:
    name: Truncate every prod data table
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'RESET PROD' }}
    timeout-minutes: 5

    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RESET PROD" ]; then
            echo "::error::confirm input did not match the required phrase"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Truncate every data table on prod
        env:
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "${PROD_USER}@${PROD_HOST}" \
            'docker exec -i akis-prod-db psql -v ON_ERROR_STOP=1 -U akis -d akis' << 'SQL'
          BEGIN;
          TRUNCATE TABLE
            agent_activities, agent_configs, agent_triggers, audit_log,
            billing_notifications, chat_retrieval_anchors,
            conversation_messages, conversation_threads,
            crew_messages, crew_runs, crew_tasks,
            dev_messages, dev_sessions, email_verification_tokens,
            feedback, integration_credentials, invite_tokens,
            job_ai_calls, job_artifacts, job_audits, job_comments,
            job_plans, job_posts, job_sources, job_traces, jobs,
            knowledge_chunks, knowledge_documents, knowledge_provenance,
            knowledge_sources, knowledge_tags,
            matches, oauth_accounts, pipelines,
            plan_candidate_builds, plan_candidates, plans,
            portfolios, profiles, proposals, skills,
            studio_sessions, subscriptions,
            thread_tasks, thread_trust_snapshots,
            usage_counters, user_ai_keys, user_billing_overrides,
            users, webhook_deliveries, workspace_billing_settings
          RESTART IDENTITY CASCADE;
          COMMIT;
          SELECT relname AS table, n_live_tup AS rows
          FROM pg_stat_user_tables
          WHERE n_live_tup > 0
          ORDER BY n_live_tup DESC, relname;
          SQL

      - name: Done
        run: |
          echo "Production database is empty (schema + migration ledger preserved)."
          echo "Visit https://akisflow.com -> sign up fresh."
